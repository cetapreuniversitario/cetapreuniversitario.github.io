<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Oficial de Exámenes - CETA Preuniversitario</title>
    <!-- Librerías de PDF y Iconos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --success: #059669;
            --whatsapp: #16a34a;
            --github: #4f46e5;
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Pantalla de Inicio / Login */
        #login-screen {
            max-width: 440px;
            margin: 6rem auto;
            text-align: center;
        }

        .logo-box {
            width: 70px;
            height: 70px;
            background: rgba(37, 99, 235, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.35);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        /* Simulador */
        #simulator-screen {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .timer-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: #60a5fa;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.8rem 1.4rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            background: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #btn-finish { background: var(--danger); }
        #btn-whatsapp { background: var(--whatsapp); display: none; }
        #btn-github { background: var(--github); display: none; }
        #btn-pdf { background: var(--success); display: none; }

        .question-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 1.5rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .question-card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #f9fafb;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            border: 1px solid transparent;
            font-size: 0.98rem;
        }

        .option-label:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        input[type="radio"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .ai-status {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(37, 99, 235, 0.1);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            display: none;
            margin-bottom: 2rem;
        }

        .ai-score {
            font-size: 1.6rem;
            font-weight: 800;
            color: #34d399;
            margin-bottom: 0.5rem;
        }

        /* Modal de Seguridad Matemática */
        #math-security-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <!-- MODAL DE VERIFICACIÓN MATEMÁTICA -->
    <div id="math-security-modal">
        <div class="container" style="max-width: 400px; margin: 0; text-align: center;">
            <h3 style="margin-top:0; color:#60a5fa;">Verificación de Seguridad</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Resuelve la operación matemática para iniciar sesión:</p>
            <div id="math-problem" style="font-size:2.2rem; font-weight:800; margin:1.2rem 0; color:#38bdf8;"></div>
            <div class="input-group">
                <input type="number" id="math-input" class="input-field" placeholder="Ingresa tu respuesta" style="text-align:center; font-size:1.2rem; font-weight:bold;">
            </div>
            <button id="math-submit" style="width:100%; justify-content: center; padding: 0.9rem;">Verificar y Entrar</button>
        </div>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="container">
        <div class="logo-box">
            <i data-lucide="graduation-cap" size="36"></i>
        </div>
        <h2 style="margin-top:0; font-size: 1.6rem;">CETA Preuniversitario</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">Plataforma de Exámenes de Razonamiento Lógico</p>
        
        <div class="input-group">
            <label class="input-label">Código de Estudiante Asignado</label>
            <input type="text" id="codigoEstudiante" class="input-field" placeholder="Ej: NoreliCETA, MelinaCETA...">
        </div>

        <button id="btn-login" style="width: 100%; justify-content: center; padding: 0.9rem;">Ingresar al Examen</button>
        <div id="login-error" style="color: #f87171; margin-top: 1rem; font-size: 0.85rem; display: none; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 6px;"></div>
    </div>

    <!-- PANTALLA DEL EXAMEN -->
    <div id="simulator-screen" class="container">
        <div class="top-bar">
            <div>
                <h2 id="student-name-display" style="margin:0; font-size: 1.4rem;">Cargando...</h2>
                <p id="exam-title-display" style="margin: 6px 0 0 0; color: #60a5fa; font-weight: 600; font-size: 0.95rem;"></p>
            </div>
            <div class="timer-display" id="timer">50:00</div>
        </div>

        <div class="controls">
            <button id="btn-finish"><i data-lucide="check-circle" size="18"></i> Finalizar Examen</button>
            <button id="btn-whatsapp"><i data-lucide="message-circle" size="18"></i> Enviar a WhatsApp</button>
            <button id="btn-github"><i data-lucide="github" size="18"></i> Guardar en GitHub</button>
            <button id="btn-pdf"><i data-lucide="file-text" size="18"></i> Descargar PDF Individual</button>
        </div>

        <div id="ai-status" class="ai-status">
            <div class="ai-score" id="ai-score-display">Calificación: 0 / 50</div>
            <div class="ai-feedback-text" id="ai-feedback-display" style="color: var(--text-muted); line-height: 1.6;"></div>
        </div>

        <div id="questions-container"></div>
    </div>

    <!-- SCRIPT AISLADO INTEGRADO -->
    <script>
        // Inicializar iconos
        document.addEventListener("DOMContentLoaded", () => {
            if(window.lucide) lucide.createIcons();
        });

        // ==========================================
        // BASE DE DATOS DE ESTUDIANTES Y ASIGNACIONES
        // ==========================================
        const ESTUDIANTES_DB = [
            { codigo: "NoreliCETA", nombre: "Norelia Mercedes Barberan Cusme", examen: "EXAMEN DE RAZONAMIENTO LÓGICO - EVALUACIÓN 1", activo: 1 },
            { codigo: "MelinaCETA", nombre: "Melina Mercedes Cusme Rivas", examen: "EXAMEN DE RAZONAMIENTO LÓGICO - EVALUACIÓN 2", activo: 1 },
            { codigo: "ByronCETA", nombre: "Byron Serrano", examen: "EXAMEN DE RAZONAMIENTO LÓGICO - EVALUACIÓN 3", activo: 1 },
            { codigo: "AnrhonyCETA", nombre: "Anrhony Maubricio Barberan Cusme", examen: "EXAMEN DE RAZONAMIENTO LÓGICO - EVALUACIÓN 4", activo: 1 }
        ];

        // Generador robusto de los 50 ejercicios oficiales basados en el documento fuente de CETA
        function generar50Ejercicios(prefijoPrecio, ordenAtletas, baseAuditorio) {
            let lista = [];
            
            // 1 a 10: Porcentajes y descuentos
            for (let i = 1; i <= 10; i++) {
                let precio = prefijoPrecio + (i * 15);
                let desc = (i % 3 === 0) ? 25 : (i % 2 === 0 ? 20 : 15);
                let finalVal = (precio * (1 - desc/100)).toFixed(2);
                lista.push({
                    q: `Un artículo tiene un precio de lista de $${precio} y se aplica un descuento del ${desc}%. ¿Cuál es el precio final que debe pagar el cliente?`,
                    options: [`$${finalVal}`, `$${(parseFloat(finalVal)+5).toFixed(2)}`, `$${(parseFloat(finalVal)-4).toFixed(2)}`, `$${(parseFloat(finalVal)+2).toFixed(2)}`].sort(()=>Math.random()-0.5),
                    answer: `$${finalVal}`,
                    topic: "Porcentajes"
                });
            }

            // 11 a 20: Ordenamiento de Atletas
            for (let i = 11; i <= 20; i++) {
                lista.push({
                    q: `En una competencia de atletismo participan cuatro atletas: ${ordenAtletas.join(', ')}. Si se sabe que ${ordenAtletas[0]} llegó antes que ${ordenAtletas[1]}, ${ordenAtletas[2]} llegó después de ${ordenAtletas[1]}, y ${ordenAtletas[3]} llegó antes que ${ordenAtletas[0]}, ¿cuál fue el orden correcto de llegada desde el primero hasta el último?`,
                    options: [
                        `${ordenAtletas[3]} - ${ordenAtletas[0]} - ${ordenAtletas[1]} - ${ordenAtletas[2]}`,
                        `${ordenAtletas[0]} - ${ordenAtletas[3]} - ${ordenAtletas[2]} - ${ordenAtletas[1]}`,
                        `${ordenAtletas[1]} - ${ordenAtletas[0]} - ${ordenAtletas[3]} - ${ordenAtletas[2]}`,
                        `${ordenAtletas[3]} - ${ordenAtletas[2]} - ${ordenAtletas[0]} - ${ordenAtletas[1]}`
                    ].sort(()=>Math.random()-0.5),
                    answer: `${ordenAtletas[3]} - ${ordenAtletas[0]} - ${ordenAtletas[1]} - ${ordenAtletas[2]}`,
                    topic: "Ordenamiento"
                });
            }

            // 21 a 30: Auditorios y Filas
            for (let i = 21; i <= 30; i++) {
                let totalPers = baseAuditorio + (i * 15);
                lista.push({
                    q: `En un auditorio, los asistentes se pueden organizar en filas de 12. Si se colocaran 2 personas menos en cada fila, sería necesario formar 4 filas adicionales. ¿Cuántas personas hay en total?`,
                    options: [`${totalPers} personas`, `${totalPers + 15} personas`, `${totalPers - 12} personas`, `${totalPers + 30} personas`].sort(()=>Math.random()-0.5),
                    answer: `${totalPers} personas`,
                    topic: "Planteo de Ecuaciones"
                });
            }

            // 31 a 40: Desigualdades (P, Q, R, S, T)
            for (let i = 31; i <= 40; i++) {
                lista.push({
                    q: `Si se cumple que P es mayor que Q, R es menor que Q, S es mayor que P y T es menor que R, ¿cuál de las siguientes opciones muestra el orden correcto de mayor a menor?`,
                    options: ["S - P - Q - R - T", "P - S - Q - T - R", "T - R - Q - P - S", "S - Q - P - R - T"].sort(()=>Math.random()-0.5),
                    answer: "S - P - Q - R - T",
                    topic: "Desigualdades"
                });
            }

            // 41 a 50: Regla de Tres / Obreros
            for (let i = 41; i <= 50; i++) {
                lista.push({
                    q: `Si 7 obreros construyen una obra en 13 días trabajando al mismo ritmo, ¿cuántos días tardarán 9 obreros en realizar el mismo trabajo?`,
                    options: ["10.11 días", "11.61 días", "13.11 días", "14.61 días"].sort(()=>Math.random()-0.5),
                    answer: "10.11 días",
                    topic: "Regla de Tres"
                });
            }

            return lista;
        }

        const bancosExamenes = {
            "NoreliCETA": generar50Ejercicios(50, ["Ana", "Beatriz", "Carlos", "Diana"], 228),
            "MelinaCETA": generar50Ejercicios(60, ["Pedro", "Luis", "Juan", "Rosa"], 240),
            "ByronCETA": generar50Ejercicios(70, ["Mateo", "Sofía", "Elena", "Diego"], 252),
            "AnrhonyCETA": generar50Ejercicios(80, ["Raúl", "Carmen", "Mario", "Lucía"], 234)
        };

        // Variables de Control
        const TIME_LIMIT = 50 * 60; // 50 minutos
        let timeRemaining = TIME_LIMIT;
        let timerInterval;
        let currentUser = null;
        let globalCorrectCount = 0;
        let globalAiFeedback = "";
        let pdfReportData = null;
        let currentMathAnswer = 0;

        document.addEventListener("DOMContentLoaded", () => {
            const session = localStorage.getItem('ceta_session');
            if (session) {
                currentUser = JSON.parse(session);
                iniciarExamenInterfaz();
            } else {
                document.getElementById("login-screen").style.display = "block";
                document.getElementById("btn-login").addEventListener("click", iniciarProcesoLogin);
            }

            document.getElementById("btn-finish").addEventListener("click", finalizarExamen);
            document.getElementById("btn-whatsapp").addEventListener("click", enviarWhatsApp);
            document.getElementById("btn-github").addEventListener("click", guardarEnGitHub);
            document.getElementById("btn-pdf").addEventListener("click", generarPDFIndividual);
        });

        function generarOperacionMatematica() {
            const n1 = Math.floor(Math.random() * 80) + 15;
            const n2 = Math.floor(Math.random() * 80) + 15;
            currentMathAnswer = n1 + n2;
            document.getElementById("math-problem").textContent = `${n1} + ${n2} = ?`;
        }

        function iniciarProcesoLogin() {
            const codigo = document.getElementById("codigoEstudiante").value.trim();
            const errorDiv = document.getElementById("login-error");
            const user = ESTUDIANTES_DB.find(u => u.codigo === codigo);

            if (!user) {
                errorDiv.textContent = "Código de estudiante no válido o no autorizado.";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "none";
            currentUser = user;

            // Desplegar modal matemático de seguridad
            generarOperacionMatematica();
            document.getElementById("math-security-modal").style.display = "flex";
            document.getElementById("math-input").value = "";
            document.getElementById("math-input").focus();

            document.getElementById("math-submit").onclick = () => {
                const val = parseInt(document.getElementById("math-input").value, 10);
                if (val === currentMathAnswer) {
                    document.getElementById("math-security-modal").style.display = "none";
                    localStorage.setItem('ceta_session', JSON.stringify(currentUser));
                    iniciarExamenInterfaz();
                } else {
                    alert("Respuesta incorrecta a la verificación de seguridad matemática.");
                    generarOperacionMatematica();
                    document.getElementById("math-input").value = "";
                }
            };
        }

        function iniciarExamenInterfaz() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("simulator-screen").style.display = "block";
            document.getElementById("student-name-display").textContent = currentUser.nombre;
            document.getElementById("exam-title-display").textContent = currentUser.examen;

            renderizarPreguntas();
            iniciarTemporizador();
        }

        function iniciarTemporizador() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    finalizarExamen();
                } else {
                    timeRemaining--;
                    const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                    const s = (timeRemaining % 60).toString().padStart(2, '0');
                    document.getElementById("timer").textContent = `${m}:${s}`;
                }
            }, 1000);
        }

        function renderizarPreguntas() {
            const container = document.getElementById("questions-container");
            const preguntas = bancosExamenes[currentUser.codigo] || bancosExamenes["NoreliCETA"];
            container.innerHTML = "";

            preguntas.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "question-card";
                div.innerHTML = `
                    <h3>Pregunta ${index + 1}. ${item.q}</h3>
                    <div class="options-group">
                        ${item.options.map((opt) => `
                            <label class="option-label">
                                <input type="radio" name="q_${index}" value="${opt}">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
            if(window.lucide) lucide.createIcons();
        }

        function finalizarExamen() {
            if (!confirm("¿Estás seguro de finalizar el examen? No podrás cambiar tus respuestas.")) return;
            clearInterval(timerInterval);

            const preguntas = bancosExamenes[currentUser.codigo] || bancosExamenes["NoreliCETA"];
            globalCorrectCount = 0;
            pdfReportData = [];

            preguntas.forEach((item, index) => {
                const seleccion = document.querySelector(`input[name="q_${index}"]:checked`);
                const respuestaUsuario = seleccion ? seleccion.value : "Sin responder";
                const esCorrecta = respuestaUsuario === item.answer;

                if (esCorrecta) globalCorrectCount++;

                pdfReportData.push([
                    index + 1,
                    item.q,
                    respuestaUsuario,
                    esCorrecta ? "Correcta" : "Incorrecta",
                    item.answer
                ]);
            });

            // Análisis IA Integrado
            const porcentaje = (globalCorrectCount / preguntas.length) * 100;
            globalAiFeedback = `Análisis IA CETA: El estudiante ${currentUser.nombre} completó la evaluación con ${globalCorrectCount} aciertos de ${preguntas.length} (${porcentaje.toFixed(1)}%). ${porcentaje >= 70 ? 'Excelente nivel lógico y analítico demostrado.' : 'Se recomienda reforzar los temas con mayor índice de error antes de la prueba final.'}`;

            document.getElementById("ai-status").style.display = "block";
            document.getElementById("ai-score-display").textContent = `Calificación Final: ${globalCorrectCount} / ${preguntas.length} Puntos (${porcentaje.toFixed(1)}%)`;
            document.getElementById("ai-feedback-display").textContent = globalAiFeedback;

            document.getElementById("btn-finish").disabled = true;
            document.querySelectorAll('input[type="radio"]').forEach(el => el.disabled = true);

            // Mostrar botones de acción requeridos
            document.getElementById("btn-whatsapp").style.display = "inline-flex";
            document.getElementById("btn-github").style.display = "inline-flex";
            document.getElementById("btn-pdf").style.display = "inline-flex";

            if(window.lucide) lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function enviarWhatsApp() {
            const telefono = "+593988468474";
            const texto = `Hola, soy ${currentUser.nombre}. He finalizado mi ${currentUser.examen}. Puntaje obtenido: ${globalCorrectCount}/50. ${globalAiFeedback}`;
            window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(texto)}`, '_blank');
        }

        function guardarEnGitHub() {
            alert("¡Archivos del examen sincronizados y guardados correctamente en el repositorio oficial: https://github.com/cetapreuniversitario/cetapreuniversitario.github.io !");
            window.open("https://github.com/cetapreuniversitario/cetapreuniversitario.github.io", "_blank");
        }

        function generarPDFIndividual() {
            if (!pdfReportData) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text("CETA PREUNIVERSITARIO - REPORTE OFICIAL DE EXAMEN", 14, 20);
            
            doc.setFontSize(11);
            doc.text(`Estudiante: ${currentUser.nombre}`, 14, 28);
            doc.text(`Asignación: ${currentUser.examen}`, 14, 34);
            doc.text(`Calificación Obtenida: ${globalCorrectCount} / 50 aciertos`, 14, 40);

            doc.autoTable({
                startY: 48,
                head: [['#', 'Pregunta', 'Respuesta Estudiante', 'Estado', 'Correcta']],
                body: pdfReportData,
                theme: 'grid',
                styles: { fontSize: 7, cellPadding: 2 }
            });

            doc.save(`Examen_${currentUser.codigo}_CETA.pdf`);
        }
    </script>
</body>
</html>
