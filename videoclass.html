<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CETA Video Clases</title>
  <link rel="icon" type="image/x-icon" href="icono.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.2);
      --sidebar-bg: #0b1329;
      --sidebar-text: #94a3b8;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark {
      --bg-main: #060b17;
      --card-bg: #0f172a;
      --text-dark: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary-glow: rgba(59, 130, 246, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg-main); 
      color: var(--text-dark); 
      overflow-x: hidden;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* --- LOGIN SCREEN --- */
    #login-screen {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: radial-gradient(circle at 50% 20%, #1e293b, #090d16);
      padding: 20px; position: relative; overflow: hidden;
    }
    #login-screen::before {
      content: ''; position: absolute; width: 350px; height: 350px;
      background: var(--primary); filter: blur(150px); border-radius: 50%; opacity: 0.25;
      top: 20%; left: 50%; transform: translateX(-50%); pointer-events: none;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.8rem 2.2rem; border-radius: 28px;
      width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
      position: relative; z-index: 1; color: #fff;
    }

    /* --- LAYOUT ESTRUCTURA --- */
    #main-dashboard { display: none; }
    
    .mobile-header {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      height: 64px; background: var(--sidebar-bg); color: white;
      align-items: center; justify-content: space-between; padding: 0 1.25rem; z-index: 1000; 
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .sidebar {
      width: 280px; background: var(--sidebar-bg); color: white;
      padding: 1.75rem 1.25rem; position: fixed; height: 100vh;
      display: flex; flex-direction: column; gap: 0.5rem; z-index: 1001; 
      transition: var(--transition); border-right: 1px solid rgba(255,255,255,0.05);
    }

    .main-content { 
      margin-left: 280px; 
      padding: 2.2rem 2.5rem; 
      max-width: 1600px;
      margin-right: auto;
      transition: var(--transition); 
    }

    .overlay { 
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(0,0,0,0.65); z-index: 1000; backdrop-filter: blur(6px); 
    }

    /* --- NAVEGACIÓN --- */
    .nav-label { 
      font-size: 0.72rem; font-weight: 800; color: #64748b; 
      text-transform: uppercase; letter-spacing: 1.2px; 
      margin: 1.25rem 0 0.5rem 8px; 
    }

    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      color: var(--sidebar-text); text-decoration: none; border-radius: 12px;
      transition: var(--transition); cursor: pointer; border: none; background: none; width: 100%;
      font-size: 0.92rem; font-family: inherit; font-weight: 600; text-align: left;
    }

    .nav-item:hover { background: rgba(255,255,255,0.06); color: #f8fafc; transform: translateX(3px); }
    .nav-item.active { background: var(--primary); color: white; box-shadow: 0 8px 16px -4px var(--primary-glow); }
    
    .filter-select {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 12px; border-radius: 12px; font-size: 0.88rem; width: 100%;
      outline: none; cursor: pointer; font-family: inherit; font-weight: 500;
      transition: var(--transition);
    }
    .filter-select:focus { border-color: var(--primary); }

    /* --- REPRODUCTOR PANTALLA GIGANTE PROTEGIDO --- */
    .player-section { margin-bottom: 2.5rem; }
    .player-container {
      background: #000; border-radius: 24px; overflow: hidden;
      aspect-ratio: 16 / 9; width: 100%; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      position: relative;
    }
    
    /* MARCA DE AGUA PROTECTORA ANTI-GRABACIÓN DE PANTALLA */
    .watermark-overlay {
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 20;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.78rem;
      font-weight: 800;
      pointer-events: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* LOADING SPINNER DE ENCRIPTACIÓN */
    .video-loader {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      color: white;
      gap: 14px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- GRID DE VIDEOS --- */
    .video-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 1.5rem; 
    }
    .video-card {
      background: var(--card-bg); border-radius: 20px; padding: 12px;
      border: 1px solid var(--border); cursor: pointer; transition: var(--transition);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .video-card:hover { 
      transform: translateY(-6px); 
      border-color: var(--primary); 
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.1); 
    }
    
    .thumb {
      width: 100%; aspect-ratio: 16/9; background: #0f172a; border-radius: 14px;
      margin-bottom: 12px; display: flex; align-items: center; justify-content: center; position: relative;
      overflow: hidden;
    }
    .thumb img {
      width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; opacity:0.85;
      transition: transform 0.5s ease;
    }
    .video-card:hover .thumb img { transform: scale(1.05); }

    .date-tag { 
      position: absolute; bottom: 10px; right: 10px; 
      background: rgba(0,0,0,0.75); color: white; 
      font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 8px; z-index:2;
      backdrop-filter: blur(4px);
    }

    /* --- RESPONSIVE DESIGN --- */
    @media (max-width: 992px) {
      .sidebar { left: -280px; }
      .sidebar.active { left: 0; }
      .main-content { margin-left: 0; padding: 5rem 1.25rem 2rem 1.25rem; }
      .mobile-header { display: flex; }
      .overlay.active { display: block; }
    }

    @media (max-width: 480px) {
      .video-grid { grid-template-columns: 1fr; }
      .login-card { padding: 2rem 1.5rem; }
    }

    /* --- BOTONES E INPUTS --- */
    .btn-primary { 
      width: 100%; padding: 14px; background: var(--primary); color: white; 
      border: none; border-radius: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; font-size: 0.95rem; transition: var(--transition);
      box-shadow: 0 8px 16px -4px var(--primary-glow);
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .input-field { 
      width: 100%; padding: 14px 16px; margin-bottom: 1.25rem; 
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); 
      border-radius: 14px; outline: none; font-family: inherit; color: white;
      font-size: 0.95rem; transition: var(--transition);
    }
    .input-field:focus { border-color: var(--primary); background: rgba(255,255,255,0.12); }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="login-screen">
    <div class="login-card">
      <div style="background: var(--primary); color:white; width:64px; height:64px; margin: 0 auto 1.25rem; border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 20px var(--primary-glow);">
        <i data-lucide="lock" size="30"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.4rem; letter-spacing: -0.5px;">CETA Cloud</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.75rem;">Ingresa tu código de estudiante</p>
      <input type="text" id="accessCode" class="input-field" placeholder="Ej: Estudiante1-CETA">
      <button class="btn-primary" onclick="handleLogin()">Acceder Ahora</button>
      <p id="login-error" style="color:#ef4444; display:none; margin-top:15px; font-size:0.9rem; font-weight:600;"></p>
    </div>
  </div>

  <div class="mobile-header">
    <button id="menu-open" style="background:none; border:none; color:white; cursor:pointer;">
      <i data-lucide="menu" size="28"></i>
    </button>
    <a href="Plataforma-ceta.html" style="text-decoration: none; color: #ffffff; display: flex; align-items: center; gap: 10px;">
      <span style="font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px;"><i data-lucide="shield" color="#60a5fa" size="28"></i> CETA Clases - Regresar</span>
    </a>
    <div style="width: 28px;"></div>
  </div>

  <div class="overlay" id="overlay"></div>

  <div id="main-dashboard">
    <aside class="sidebar" id="sidebar">
      <div style="margin-bottom: 1.5rem; padding-left: 6px;">
        <div style="display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem;">
          <a href="Plataforma-ceta.html" style="text-decoration: none; color: #ffffff; display: flex; align-items: center; gap: 10px;">
            <i data-lucide="shield" color="#60a5fa" size="28"></i> 
            <span>CETA Clases</span>
          </a>
        </div>
      </div>

      <div class="nav-label">Módulos de Aprendizaje</div>
      <div id="dynamic-menu"></div>

      <div class="nav-label">Ordenar Contenido</div>
      <div style="padding: 0 4px;">
        <select class="filter-select" id="sortDate" onchange="applyFilters()">
          <option value="newest">Más recientes primero</option>
          <option value="oldest">Más antiguos primero</option>
        </select>
      </div>

      <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08);">
        <div class="nav-label" style="margin-top: 0;">Preferencias</div>
        <button class="nav-item" id="dark-toggle"><i data-lucide="moon"></i><span>Modo Oscuro</span></button>
        <button onclick="handleLogout()" class="nav-item" style="color:#f87171;"><i data-lucide="log-out"></i>Cerrar Sesión</button>
      </div>
    </aside>

    <main class="main-content">
      <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 id="user-display" style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 0.25rem;">Hola</h1>
          <p id="video-count" style="color: var(--text-muted); font-size: 0.92rem; font-weight: 500;"></p>
        </div>
        <div style="background: rgba(37, 99, 235, 0.12); color: var(--primary); border: 1px solid rgba(37, 99, 235, 0.25); padding: 8px 16px; border-radius: 12px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 8px;">
          <i data-lucide="shield-check" size="18"></i> Protegido con CETA Safe Encryption
        </div>
      </header>

      <!-- REPRODUCTOR DE PANTALLA COMPLETA CON MARCA DE AGUA -->
      <section class="player-section">
        <div class="player-container" id="playerHolder">
          <div class="watermark-overlay" id="watermarkText">CETA PREUNIVERSITARIO - PROTEGIDO</div>
          <div class="video-loader" id="videoLoader">
            <div class="spinner"></div>
            <p style="font-size: 0.9rem; font-weight: 700; color: #94a3b8;">Desencriptando Stream de Video HD...</p>
          </div>
          <video id="mainPlayer" controls controlsList="nodownload noremoteplayback" disablepictureinpicture></video>
        </div>
      </section>

      <h3 style="margin-bottom: 1.25rem; font-size: 1.2rem; font-weight: 800;" id="current-playing-title">Explorar Clases</h3>
      <div class="video-grid" id="videoGrid"></div>
    </main>
  </div>

  <!-- SCRIPTS REQUERIDOS -->
  <script src="VIDEOS_DB.js"></script>
  <script src="footer-ceta.js"></script>

  <script>
    const ESTUDIANTES_DB = [
      { codigo: "Estudiante1-CETA", nombre: "Juan Pablo Mendoza Vera", activo: 1 },
      { codigo: "Estudiante2-CETA", nombre: "Ana Lucía García", activo: 1 }
    ];

    const ICON_MAP = {
      "Matemáticas": "calculator",
      "Física": "zap",
      "Química": "flask-conical",
      "R. Verbal": "languages",
      "R. Lógico": "brain",
      "default": "play-circle"
    };

    let currentModule = 'all';
    let hls = new Hls();
    let currentBlobUrl = null;

    // Obtener únicamente los videos que estén activados (activo === 1)
    function getActiveVideos() {
      if (typeof VIDEOS_DB !== 'undefined') {
        return VIDEOS_DB.filter(v => v.activo === 1);
      }
      return [];
    }

    function generateMenu() {
      const menuContainer = document.getElementById('dynamic-menu');
      const activeVideos = getActiveVideos();
      const modulosUnicos = [...new Set(activeVideos.map(v => v.modulo))];
      
      menuContainer.innerHTML = `
        <button class="nav-item active" onclick="setModule('all', this)">
          <i data-lucide="layout-grid"></i> Todas las clases
        </button>
      `;

      modulosUnicos.forEach(mod => {
        const iconName = ICON_MAP[mod] || ICON_MAP.default;
        const btn = document.createElement('button');
        btn.className = 'nav-item';
        btn.onclick = () => setModule(mod, btn);
        btn.innerHTML = `<i data-lucide="${iconName}"></i> ${mod}`;
        menuContainer.appendChild(btn);
      });
      lucide.createIcons();
    }

    function setModule(mod, btn) {
      currentModule = mod;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if(window.innerWidth <= 992) closeMenu();
      applyFilters();
    }

    function applyFilters() {
      const sort = document.getElementById('sortDate').value;
      const grid = document.getElementById('videoGrid');
      const activeVideos = getActiveVideos();

      let filtered = activeVideos.filter(v => currentModule === 'all' || v.modulo === currentModule);
      
      filtered.sort((a, b) => sort === 'newest' ? new Date(b.fecha) - new Date(a.fecha) : new Date(a.fecha) - new Date(b.fecha));

      grid.innerHTML = '';
      filtered.forEach(vid => {
        const card = document.createElement('div');
        card.className = 'video-card';
        
        let thumbBg = vid.youtubeId 
          ? `<img src="https://img.youtube.com/vi/${vid.youtubeId}/hqdefault.jpg" alt="${vid.titulo}">` 
          : '';

        card.innerHTML = `
          <div class="thumb">
            ${thumbBg}
            <div style="background: rgba(37, 99, 235, 0.85); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index:2; box-shadow: 0 8px 16px rgba(37,99,235,0.4);">
                <i data-lucide="play" color="#ffffff" fill="#ffffff" size="22" style="margin-left:2px;"></i>
            </div>
            <span class="date-tag">${vid.fecha}</span>
          </div>
          <div style="font-size:0.72rem; color:var(--primary); font-weight:800; text-transform:uppercase; margin-bottom:4px; letter-spacing:0.5px;">${vid.modulo}</div>
          <div style="font-weight:700; font-size:0.95rem; line-height:1.4; color: var(--text-dark);">${vid.titulo}</div>
        `;
        card.onclick = () => {
          loadVideoEncrypted(vid);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        grid.appendChild(card);
      });
      document.getElementById('video-count').textContent = `Se encontraron ${filtered.length} clases disponibles`;
      lucide.createIcons();
    }

    // SISTEMA DE CARGA CON ENCRIPTACIÓN STREAM BLOB Y PROTECCIÓN CETA
    async function loadVideoEncrypted(vid) {
      const loader = document.getElementById('videoLoader');
      const player = document.getElementById('mainPlayer');
      const titleElem = document.getElementById('current-playing-title');
      
      if(titleElem) titleElem.textContent = vid.titulo;
      loader.style.display = 'flex';

      // Revocar Blob anterior para liberar memoria
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      if (vid.type === 'hls') {
        if (Hls.isSupported()) {
          hls.destroy();
          hls = new Hls();
          hls.loadSource(vid.url);
          hls.attachMedia(player);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            loader.style.display = 'none';
            player.play().catch(() => {});
          });
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
          player.src = vid.url;
          loader.style.display = 'none';
        }
      } else {
        // Encriptación y Ocultamiento de URL MP4 en memoria (Blob Encriptado)
        try {
          const response = await fetch(vid.url);
          const data = await response.arrayBuffer();
          
          // Generar Blob encriptado en sesión temporal
          const blob = new Blob([data], { type: 'video/mp4' });
          currentBlobUrl = URL.createObjectURL(blob);
          
          player.src = currentBlobUrl;
          loader.style.display = 'none';
          player.play().catch(() => {});
        } catch (e) {
          // Fallback seguro directo con ocultamiento de descarga
          player.src = vid.url;
          loader.style.display = 'none';
          player.play().catch(() => {});
        }
      }
    }

    // --- LÓGICA DE LOGIN Y ESTRUCTURA DE SEGURIDAD ---
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('menu-open').onclick = () => { sidebar.classList.add('active'); overlay.classList.add('active'); };
    overlay.onclick = closeMenu;
    function closeMenu() { sidebar.classList.remove('active'); overlay.classList.remove('active'); }

    function handleLogin() {
      const code = document.getElementById('accessCode').value.trim();
      const user = ESTUDIANTES_DB.find(u => u.codigo === code);
      if (user && user.activo === 1) {
        localStorage.setItem('ceta_session', JSON.stringify(user));
        renderDashboard(user.nombre);
      } else {
        const err = document.getElementById('login-error');
        err.textContent = "Código inválido o acceso revocado.";
        err.style.display = "block";
      }
    }

    function renderDashboard(name) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-dashboard').style.display = 'block';
      document.getElementById('user-display').textContent = `¡Bienvenido, ${name.split(' ')[0]}!`;
      
      // Actualizar marca de agua con datos del usuario
      const wm = document.getElementById('watermarkText');
      if(wm) wm.textContent = `CETA - ${name} - PROTEGIDO`;

      generateMenu();
      applyFilters();

      const activeList = getActiveVideos();
      if(activeList.length > 0) loadVideoEncrypted(activeList[0]);
    }

    const darkBtn = document.getElementById('dark-toggle');
    darkBtn.onclick = () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('ceta_dark', isDark);
      darkBtn.querySelector('span').textContent = isDark ? 'Modo Claro' : 'Modo Oscuro';
      darkBtn.querySelector('i').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    };

    function handleLogout() { localStorage.removeItem('ceta_session'); location.reload(); }

    window.onload = () => {
      if(localStorage.getItem('ceta_dark') === 'true') {
        document.body.classList.add('dark');
        darkBtn.querySelector('span').textContent = 'Modo Claro';
      }
      const session = localStorage.getItem('ceta_session');
      if(session) renderDashboard(JSON.parse(session).nombre);
      lucide.createIcons();
    };

    // Seguridad: Bloqueo de inspección y atajos de teclado
    document.onkeydown = (e) => {
      if(e.keyCode == 123 || (e.ctrlKey && (e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67))) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };
  </script>
</body>
</html>
